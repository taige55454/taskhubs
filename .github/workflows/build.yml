name: Build & Test Single Binary

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tidy Dependencies
        run: go mod tidy

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Embed Windows Manifest (DPI Awareness & Standard User Trust)
        run: |
          go install github.com/akavel/rsrc@latest
          cat << 'EOF' > app.manifest
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0" xmlns:asmv3="urn:schemas-microsoft-com:asm.v3">
            <assemblyIdentity version="2.0.0.0" processorArchitecture="*" name="Intranet.TaskHub.Server" type="win32"/>
            <description>Intranet Multi-Post Task &amp; Rota Server</description>
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security>
                <requestedPrivileges>
                  <requestedExecutionLevel level="asInvoker" uiAccess="false"/>
                </requestedPrivileges>
              </security>
            </trustInfo>
            <asmv3:application>
              <asmv3:windowsSettings>
                <dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware>
                <dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2,PerMonitor</dpiAwareness>
              </asmv3:windowsSettings>
            </asmv3:application>
          </assembly>
          EOF
          $(go env GOPATH)/bin/rsrc -manifest app.manifest -arch amd64 -o rsrc_windows_amd64.syso
          rm -f app.manifest

      - name: Build Windows AMD64 (System Tray, Single Instance)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/taskhub-windows-amd64.exe .
          rm -f rsrc_windows_amd64.syso

      - name: Build Linux AMD64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o dist/taskhub-linux-amd64 .

      - name: Build Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o dist/taskhub-linux-arm64 .

      - name: Build macOS Apple Silicon (ARM64)
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o dist/taskhub-darwin-arm64 .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taskhub-binaries
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
